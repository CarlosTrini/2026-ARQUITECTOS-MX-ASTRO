<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 180" width="1240" height="360">
  <defs>
    <style>
      .brand-title {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-size: 60px;
        font-weight: 800;
        fill: #F5F5F5;
        letter-spacing: -0.5px;
      }
      .badge-circle {
        fill: #F2B705;
      }
      .badge-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-size: 19px;
        font-weight: 900;
        fill: #202020;
      }
      .accent-bar {
        fill: #F2B705;
      }
      .brand-subtitle {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-size: 19px;
        font-weight: 600;
        fill: #F5F5F5;
        letter-spacing: 4px;
      }
    </style>
  </defs>

  <g transform="translate(15, 10)">
    <!-- Arquitectos -->
    <text x="5" y="70" class="brand-title">Arquitectos</text>
    
    <!-- MX Golden Badge -->
    <circle cx="430" cy="54" r="23" class="badge-circle" />
    <text x="430" y="61" text-anchor="middle" class="badge-text">MX</text>
    
    <!-- Golden Divider Bar -->
    <rect x="6" y="98" width="370" height="4" rx="2" class="accent-bar" />
    
    <!-- Innovación y Diseño -->
    <text x="7" y="134" class="brand-subtitle">Innovación y Diseño</text>
  </g>
</svg>